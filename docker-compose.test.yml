# Ambiente de E2E (seção 11.1): `docker compose -f docker-compose.test.yml up --wait`.
name: vagas-test

x-app-env: &app-env
  NODE_ENV: test
  ENABLE_TEST_ROUTES: "true"
  DATABASE_URL: postgresql://vagas:vagas@postgres:5432/vagas_test?schema=public
  REDIS_URL: redis://redis:6379
  WEB_URL: http://localhost:3000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: vagas, POSTGRES_PASSWORD: vagas, POSTGRES_DB: vagas_test }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vagas"], interval: 2s, retries: 30 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30 }

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *app-env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/v1/saude"]
      interval: 2s
      retries: 60
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: *app-env
    command: node dist/worker.js
    depends_on: { api: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    env_file: .env
    environment: { API_URL: http://api:3001 }
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 2s
      retries: 60
    depends_on: { api: { condition: service_healthy } }
